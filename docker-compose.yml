services:
  backend:
    image: 623116374689.dkr.ecr.ap-south-1.amazonaws.com/mosaic-wall-backend:latest
    container_name: mosaic-wall-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://host.docker.internal:6379/0 
      - DATABASE_URL=mongodb://mosaic-wall-mongodb:27017/mosaic_db
    depends_on:
      - mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mosaic-network

  mongodb:
    image: mongo:latest
    container_name: mosaic-wall-mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mosaic-network

volumes:
  mongo-data:

networks:
  mosaic-network:
    driver: bridge