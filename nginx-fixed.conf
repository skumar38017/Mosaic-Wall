# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name mosaicwall.events www.mosaicwall.events;

    root /var/www/mosaic-wall-frontend;
    index index.html;

    # -----------------------
    # GZIP Compression
    # -----------------------
    gzip on;
    gzip_min_length 1000;
    gzip_comp_level 5;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/rss+xml
        text/javascript
        image/svg+xml;

    # -----------------------
    # Security Headers
    # -----------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # -----------------------
    # React Static Cache
    # -----------------------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -----------------------
    # React SPA Routing
    # -----------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -----------------------
    # WebSocket endpoints - Enhanced for 24/7 streaming
    # -----------------------
    location ~ ^/api/ws[0-9]*$ {
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 24/7 streaming timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Critical for continuous streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # -----------------------
    # Regular API endpoints
    # -----------------------
    location /api/ {
        proxy_pass http://localhost:8000/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 60s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mosaicwall.events/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mosaicwall.events/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.mosaicwall.events) {
        return 301 https://$host$request_uri;
    }

    if ($host = mosaicwall.events) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name mosaicwall.events www.mosaicwall.events;
    return 404;
}
